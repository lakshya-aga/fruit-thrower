name: Deploy Container to EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Publish Container"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail

            IMAGE="ghcr.io/${{ github.repository_owner }}/fruit-thrower:latest"
            CONTAINER_NAME="fruit-thrower"

            sudo mkdir -p /opt/fruit-thrower/.code_index-fin-kit
            sudo mkdir -p /opt/fruit-thrower/.tool_builder

            # Public GHCR first (no auth). Fallback to auth only if configured.
            if ! sudo docker pull "$IMAGE"; then
              if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_PAT }}" ]; then
                echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
                sudo docker pull "$IMAGE"
              else
                echo "Anonymous pull failed and GHCR creds are not configured."
                exit 1
              fi
            fi

            # Stop legacy host service if it is still bound to 127.0.0.1:8090
            sudo systemctl stop fruit-thrower || true

            if sudo docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              sudo docker stop "$CONTAINER_NAME" || true
              sudo docker rm "$CONTAINER_NAME" || true
            fi

            # Safety: free host port if another process is listening
            PID_ON_8090=$(sudo lsof -t -iTCP:8090 -sTCP:LISTEN || true)
            if [ -n "$PID_ON_8090" ]; then
              sudo kill -9 $PID_ON_8090 || true
            fi

            # Build runtime-only env file from GitHub Secrets (not baked into image)
            TMP_ENV="/tmp/fruit-thrower.env"
            sudo rm -f "$TMP_ENV"

            FRUIT_TOOL_BUILDER_CMD_VAL='${{ secrets.FRUIT_TOOL_BUILDER_CMD }}'
            FRUIT_TOOL_TRACE_LOG_VAL='${{ secrets.FRUIT_TOOL_TRACE_LOG }}'
            AGENT_GITHUB_TOKEN_VAL='${{ secrets.AGENT_GITHUB_TOKEN }}'
            AGENT_GITHUB_REPO_VAL='${{ secrets.AGENT_GITHUB_REPO }}'
            AGENT_GITHUB_REPO_FIN_KIT_VAL='${{ secrets.AGENT_GITHUB_REPO_FIN_KIT }}'
            AGENT_PR_BASE_VAL='${{ secrets.AGENT_PR_BASE }}'
            AGENT_PR_BASE_FIN_KIT_VAL='${{ secrets.AGENT_PR_BASE_FIN_KIT }}'
            AGENT_AUTO_PR_VAL='${{ secrets.AGENT_AUTO_PR }}'

            [ -z "$FRUIT_TOOL_BUILDER_CMD_VAL" ] && FRUIT_TOOL_BUILDER_CMD_VAL='python3 scripts/agent_pipeline.py --request {request_file} --push'
            [ -z "$FRUIT_TOOL_TRACE_LOG_VAL" ] && FRUIT_TOOL_TRACE_LOG_VAL='.tool_builder/trace.jsonl'
            [ -z "$AGENT_GITHUB_REPO_VAL" ] && AGENT_GITHUB_REPO_VAL='lakshya-aga/fruit-thrower'
            [ -z "$AGENT_GITHUB_REPO_FIN_KIT_VAL" ] && AGENT_GITHUB_REPO_FIN_KIT_VAL='lakshya-aga/fin-kit'
            [ -z "$AGENT_PR_BASE_VAL" ] && AGENT_PR_BASE_VAL='deploy'
            [ -z "$AGENT_PR_BASE_FIN_KIT_VAL" ] && AGENT_PR_BASE_FIN_KIT_VAL='main'
            [ -z "$AGENT_AUTO_PR_VAL" ] && AGENT_AUTO_PR_VAL='0'

            printf '%s\n' "FRUIT_TOOL_BUILDER_CMD=$FRUIT_TOOL_BUILDER_CMD_VAL" | sudo tee -a "$TMP_ENV" >/dev/null
            printf '%s\n' "FRUIT_TOOL_TRACE_LOG=$FRUIT_TOOL_TRACE_LOG_VAL" | sudo tee -a "$TMP_ENV" >/dev/null
            printf '%s\n' "AGENT_GITHUB_TOKEN=$AGENT_GITHUB_TOKEN_VAL" | sudo tee -a "$TMP_ENV" >/dev/null
            printf '%s\n' "AGENT_GITHUB_REPO=$AGENT_GITHUB_REPO_VAL" | sudo tee -a "$TMP_ENV" >/dev/null
            printf '%s\n' "AGENT_GITHUB_REPO_FIN_KIT=$AGENT_GITHUB_REPO_FIN_KIT_VAL" | sudo tee -a "$TMP_ENV" >/dev/null
            printf '%s\n' "AGENT_PR_BASE=$AGENT_PR_BASE_VAL" | sudo tee -a "$TMP_ENV" >/dev/null
            printf '%s\n' "AGENT_PR_BASE_FIN_KIT=$AGENT_PR_BASE_FIN_KIT_VAL" | sudo tee -a "$TMP_ENV" >/dev/null
            printf '%s\n' "AGENT_AUTO_PR=$AGENT_AUTO_PR_VAL" | sudo tee -a "$TMP_ENV" >/dev/null
            sudo chmod 600 "$TMP_ENV"

            set -x
            if ! sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 127.0.0.1:8090:8090 \
              -v /opt/fruit-thrower/.code_index-fin-kit:/app/.code_index-fin-kit \
              -v /opt/fruit-thrower/.tool_builder:/app/.tool_builder \
              --env-file "$TMP_ENV" \
              "$IMAGE"; then
              set +x
              echo "docker run failed; dumping diagnostics"
              sudo docker ps -a --filter "name=${CONTAINER_NAME}" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
              sudo docker logs --tail 200 "$CONTAINER_NAME" || true
              echo "port 8090 listeners:"
              sudo ss -ltnp | grep 8090 || true
              exit 1
            fi
            set +x

            # cleanup runtime env file from host disk
            sudo shred -u "$TMP_ENV" || sudo rm -f "$TMP_ENV"

            sleep 3
            sudo docker ps --filter "name=${CONTAINER_NAME}" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
