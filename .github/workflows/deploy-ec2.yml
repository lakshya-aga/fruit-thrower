name: Deploy Container to EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Publish Container"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail

            IMAGE="ghcr.io/${{ github.repository_owner }}/fruit-thrower:latest"
            CONTAINER_NAME="fruit-thrower"

            mkdir -p /opt/fruit-thrower/.code_index-fin-kit
            mkdir -p /opt/fruit-thrower/.tool_builder

            # Public GHCR first (no auth). Fallback to auth only if configured.
            if ! docker pull "$IMAGE"; then
              if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_PAT }}" ]; then
                echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
                docker pull "$IMAGE"
              else
                echo "Anonymous pull failed and GHCR creds are not configured."
                exit 1
              fi
            fi

            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              docker stop "$CONTAINER_NAME" || true
              docker rm "$CONTAINER_NAME" || true
            fi

            ENV_FILE_ARG=""
            if [ -f /etc/fruit-thrower/env ]; then
              ENV_FILE_ARG="--env-file /etc/fruit-thrower/env"
            fi

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 127.0.0.1:8090:8090 \
              -v /opt/fruit-thrower/.code_index-fin-kit:/app/.code_index-fin-kit \
              -v /opt/fruit-thrower/.tool_builder:/app/.tool_builder \
              $ENV_FILE_ARG \
              "$IMAGE"

            sleep 3
            docker ps --filter "name=${CONTAINER_NAME}" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
